<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Organizer Dashboard - EventHub</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 15px 30px;
        }

        .brand {
            font-size: 24px;
            font-weight: 700;
            color: #1769ff;
        }

        .organizer-label {
            color: #6c757d;
            font-size: 14px;
        }

        /* =========================
           MAIN CONTAINER
        ========================= */

        .main-container {
            max-width: 1250px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-title {
            font-size: 30px;
            font-weight: 700;
            color: #212529;
        }

        .page-subtitle {
            color: #6c757d;
            margin-top: 5px;
        }

        /* =========================
           STAT CARDS
        ========================= */

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            border: 1px solid #e5e7eb;
            height: 100%;
            transition: 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eaf2ff;
            color: #1769ff;
            font-size: 22px;
            margin-bottom: 15px;
        }

        .stat-number {
            font-size: 28px;
            font-weight: 700;
        }

        .stat-title {
            color: #6c757d;
            font-size: 14px;
        }

        /* =========================
           BUTTON
        ========================= */

        .create-btn {
            background: #1769ff;
            border: none;
            padding: 12px 22px;
            border-radius: 8px;
            font-weight: 600;
        }

        .create-btn:hover {
            background: #0d5ce5;
        }

        /* =========================
           EVENT SECTION
        ========================= */

        .section-card {
            background: white;
            border-radius: 15px;
            border: 1px solid #e5e7eb;
            padding: 25px;
            margin-top: 30px;
        }

        .section-title {
            font-size: 22px;
            font-weight: 700;
        }

        /* =========================
           EVENT CARD
        ========================= */

        .event-card {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            background: white;
        }

        .event-title {
            font-size: 20px;
            font-weight: 700;
        }

        .event-category {
            display: inline-block;
            background: #eaf2ff;
            color: #1769ff;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 8px;
        }

        .event-info {
            color: #6c757d;
            margin-top: 10px;
            font-size: 14px;
        }

        .event-stat {
            text-align: center;
            padding: 10px;
        }

        .event-stat-number {
            font-size: 20px;
            font-weight: 700;
        }

        .event-stat-label {
            color: #6c757d;
            font-size: 12px;
        }

        /* =========================
           CREATE EVENT FORM
        ========================= */

        #createEventSection {
            display: none;
        }

        .form-card {
            background: white;
            border-radius: 15px;
            border: 1px solid #e5e7eb;
            padding: 30px;
            margin-top: 30px;
        }

        .form-label {
            font-weight: 600;
            margin-bottom: 7px;
        }

        .form-control,
        .form-select {
            padding: 12px;
            border-radius: 8px;
        }

        textarea.form-control {
            min-height: 120px;
        }

        .save-btn {
            background: #1769ff;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: 600;
        }

        .cancel-btn {
            padding: 12px 25px;
            border-radius: 8px;
        }

        /* =========================
           EMPTY STATE
        ========================= */

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #6c757d;
        }

        .empty-state i {
            font-size: 50px;
            color: #adb5bd;
            margin-bottom: 15px;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 768px) {

            .navbar {
                padding: 15px;
            }

            .main-container {
                margin-top: 25px;
            }

            .page-title {
                font-size: 25px;
            }

            .create-btn {
                width: 100%;
                margin-top: 15px;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar">

    <div class="container-fluid">

        <div class="brand">
            <i class="bi bi-calendar-event me-2"></i>
            EventHub
        </div>

        <div class="d-flex align-items-center gap-3">

            <span class="organizer-label">
                <i class="bi bi-person-circle me-1"></i>
                Organizer
            </span>

            <button
                class="btn btn-outline-danger btn-sm"
                onclick="logout()">

                <i class="bi bi-box-arrow-right me-1"></i>
                Logout

            </button>

        </div>

    </div>

</nav>



<!-- =========================
     MAIN
========================= -->

<div class="main-container">


    <!-- =========================
         HEADER
    ========================= -->

    <div class="d-flex justify-content-between align-items-start flex-wrap">

        <div>

            <h1 class="page-title">
                Organizer Dashboard
            </h1>

            <p class="page-subtitle">
                Create and manage your events and track bookings.
            </p>

        </div>


        <button
            class="btn btn-primary create-btn"
            onclick="showCreateEvent()">

            <i class="bi bi-plus-lg me-2"></i>
            Create New Event

        </button>

    </div>



    <!-- =========================
         STATISTICS
    ========================= -->

    <div class="row g-4 mt-2">


        <!-- TOTAL EVENTS -->

        <div class="col-md-6 col-lg-3">

            <div class="stat-card">

                <div class="stat-icon">

                    <i class="bi bi-calendar-event"></i>

                </div>

                <div
                    id="totalEvents"
                    class="stat-number">

                    0

                </div>

                <div class="stat-title">

                    Total Events

                </div>

            </div>

        </div>



        <!-- CANDIDATES -->

        <div class="col-md-6 col-lg-3">

            <div class="stat-card">

                <div class="stat-icon">

                    <i class="bi bi-people"></i>

                </div>

                <div
                    id="totalCandidates"
                    class="stat-number">

                    0

                </div>

                <div class="stat-title">

                    Candidates Booked

                </div>

            </div>

        </div>



        <!-- TICKETS -->

        <div class="col-md-6 col-lg-3">

            <div class="stat-card">

                <div class="stat-icon">

                    <i class="bi bi-ticket-perforated"></i>

                </div>

                <div
                    id="totalTickets"
                    class="stat-number">

                    0

                </div>

                <div class="stat-title">

                    Tickets Sold

                </div>

            </div>

        </div>



        <!-- REVENUE -->

        <div class="col-md-6 col-lg-3">

            <div class="stat-card">

                <div class="stat-icon">

                    <i class="bi bi-currency-rupee"></i>

                </div>

                <div
                    id="totalRevenue"
                    class="stat-number">

                    ₹0

                </div>

                <div class="stat-title">

                    Total Revenue

                </div>

            </div>

        </div>

    </div>



    <!-- =========================
         CREATE EVENT SECTION
    ========================= -->

    <div
        id="createEventSection"
        class="form-card">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h3 class="section-title mb-1">
                    Create New Event
                </h3>

                <p class="text-secondary mb-0">
                    Enter the details of your event.
                </p>

            </div>

            <button
                class="btn btn-outline-secondary"
                onclick="hideCreateEvent()">

                <i class="bi bi-x-lg"></i>

            </button>

        </div>



        <form id="eventForm">


            <!-- EVENT NAME -->

            <div class="mb-3">

                <label class="form-label">
                    Event Name
                </label>

                <input
                    type="text"
                    id="eventName"
                    class="form-control"
                    placeholder="Enter event name"
                    required>

            </div>



            <!-- CATEGORY -->

            <div class="row g-3">


                <div class="col-md-6">

                    <label class="form-label">
                        Category
                    </label>

                    <select
                        id="eventCategory"
                        class="form-select"
                        required>

                        <option value="">
                            Select Category
                        </option>

                        <option value="Technology">
                            Technology
                        </option>

                        <option value="Music">
                            Music
                        </option>

                        <option value="Business">
                            Business
                        </option>

                        <option value="Sports">
                            Sports
                        </option>

                        <option value="Education">
                            Education
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>



                <!-- DATE -->

                <div class="col-md-6">

                    <label class="form-label">
                        Event Date
                    </label>

                    <input
                        type="date"
                        id="eventDate"
                        class="form-control"
                        required>

                </div>

            </div>



            <!-- TIME + VENUE -->

            <div class="row g-3 mt-1">


                <div class="col-md-6">

                    <label class="form-label">
                        Event Time
                    </label>

                    <input
                        type="time"
                        id="eventTime"
                        class="form-control"
                        required>

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Venue
                    </label>

                    <input
                        type="text"
                        id="eventVenue"
                        class="form-control"
                        placeholder="Enter venue"
                        required>

                </div>

            </div>



            <!-- DESCRIPTION -->

            <div class="mb-3 mt-3">

                <label class="form-label">
                    Event Description
                </label>

                <textarea
                    id="eventDescription"
                    class="form-control"
                    placeholder="Enter event description"
                    required></textarea>

            </div>



            <!-- TICKET PRICES -->

            <h5 class="fw-bold mt-4 mb-3">
                Ticket Details
            </h5>


            <div class="row g-3">


                <!-- STANDARD PRICE -->

                <div class="col-md-6">

                    <label class="form-label">
                        Standard Ticket Price
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            ₹
                        </span>

                        <input
                            type="number"
                            id="standardPrice"
                            class="form-control"
                            placeholder="199"
                            min="0"
                            required>

                    </div>

                </div>



                <!-- VIP PRICE -->

                <div class="col-md-6">

                    <label class="form-label">
                        VIP Ticket Price
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            ₹
                        </span>

                        <input
                            type="number"
                            id="vipPrice"
                            class="form-control"
                            placeholder="499"
                            min="0"
                            required>

                    </div>

                </div>



                <!-- STANDARD AVAILABLE -->

                <div class="col-md-6">

                    <label class="form-label">
                        Standard Tickets Available
                    </label>

                    <input
                        type="number"
                        id="standardAvailable"
                        class="form-control"
                        placeholder="500"
                        min="0"
                        required>

                </div>



                <!-- VIP AVAILABLE -->

                <div class="col-md-6">

                    <label class="form-label">
                        VIP Tickets Available
                    </label>

                    <input
                        type="number"
                        id="vipAvailable"
                        class="form-control"
                        placeholder="100"
                        min="0"
                        required>

                </div>

            </div>



            <!-- BUTTONS -->

            <div class="d-flex gap-2 mt-4">

                <button
                    type="submit"
                    class="btn btn-primary save-btn">

                    <i class="bi bi-check-lg me-2"></i>
                    Create Event

                </button>


                <button
                    type="button"
                    class="btn btn-outline-secondary cancel-btn"
                    onclick="hideCreateEvent()">

                    Cancel

                </button>

            </div>

        </form>

    </div>



    <!-- =========================
         EVENTS
    ========================= -->

    <div class="section-card">

        <div class="d-flex justify-content-between align-items-center">

            <div>

                <h3 class="section-title mb-1">
                    Your Events
                </h3>

                <p class="text-secondary mb-0">
                    Manage your created events and view performance.
                </p>

            </div>

        </div>



        <!-- EVENT LIST -->

        <div id="eventList">

            <!-- Events will appear here -->

        </div>

    </div>


</div>



<!-- =========================
     JAVASCRIPT
========================= -->

<script>


/* =========================
   SHOW CREATE EVENT
========================= */

function showCreateEvent() {

    document.getElementById(
        "createEventSection"
    ).style.display = "block";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}



/* =========================
   HIDE CREATE EVENT
========================= */

function hideCreateEvent() {

    document.getElementById(
        "createEventSection"
    ).style.display = "none";

}



/* =========================
   CREATE EVENT
========================= */

document.getElementById(
    "eventForm"
).addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        /* Get values */

        const eventName =
            document.getElementById(
                "eventName"
            ).value;

        const eventCategory =
            document.getElementById(
                "eventCategory"
            ).value;

        const eventDate =
            document.getElementById(
                "eventDate"
            ).value;

        const eventTime =
            document.getElementById(
                "eventTime"
            ).value;

        const eventVenue =
            document.getElementById(
                "eventVenue"
            ).value;

        const eventDescription =
            document.getElementById(
                "eventDescription"
            ).value;

        const standardPrice =
            Number(
                document.getElementById(
                    "standardPrice"
                ).value
            );

        const vipPrice =
            Number(
                document.getElementById(
                    "vipPrice"
                ).value
            );

        const standardAvailable =
            Number(
                document.getElementById(
                    "standardAvailable"
                ).value
            );

        const vipAvailable =
            Number(
                document.getElementById(
                    "vipAvailable"
                ).value
            );


        /* Create event object */

        const newEvent = {

            id: Date.now(),

            name: eventName,

            category: eventCategory,

            date: eventDate,

            time: eventTime,

            venue: eventVenue,

            description:
                eventDescription,

            standardPrice:
                standardPrice,

            vipPrice:
                vipPrice,

            standardAvailable:
                standardAvailable,

            vipAvailable:
                vipAvailable,

            createdAt:
                new Date().toISOString()

        };


        /* Get existing events */

        let events =
            JSON.parse(
                localStorage.getItem(
                    "organizerEvents"
                )
            ) || [];


        /* Add new event */

        events.push(newEvent);


        /* Save */

        localStorage.setItem(
            "organizerEvents",
            JSON.stringify(events)
        );


        /* Reset form */

        document.getElementById(
            "eventForm"
        ).reset();


        /* Hide form */

        hideCreateEvent();


        /* Refresh dashboard */

        loadDashboard();


        alert(
            "Event created successfully!"
        );

    }
);



/* =========================
   LOAD DASHBOARD
========================= */

function loadDashboard() {


    /* Get events */

    const events =
        JSON.parse(
            localStorage.getItem(
                "organizerEvents"
            )
        ) || [];


    /* Get bookings */

    const bookings =
        JSON.parse(
            localStorage.getItem(
                "bookings"
            )
        ) || [];


    /* Total events */

    document.getElementById(
        "totalEvents"
    ).textContent =
        events.length;


    /* Total candidates */

    document.getElementById(
        "totalCandidates"
    ).textContent =
        bookings.length;


    /* Total tickets */

    let totalTickets = 0;

    let totalRevenue = 0;


    bookings.forEach(
        function(booking) {

            totalTickets +=
                Number(
                    booking.totalTickets || 0
                );

            totalRevenue +=
                Number(
                    booking.totalPrice || 0
                );

        }
    );


    document.getElementById(
        "totalTickets"
    ).textContent =
        totalTickets;


    document.getElementById(
        "totalRevenue"
    ).textContent =
        "₹" +
        totalRevenue.toLocaleString(
            "en-IN"
        );


    /* Display events */

    displayEvents(
        events,
        bookings
    );

}



/* =========================
   DISPLAY EVENTS
========================= */

function displayEvents(
    events,
    bookings
) {


    const eventList =
        document.getElementById(
            "eventList"
        );


    /* No events */

    if (events.length === 0) {

        eventList.innerHTML = `

            <div class="empty-state">

                <i class="bi bi-calendar-x"></i>

                <h5>
                    No Events Created
                </h5>

                <p>
                    Create your first event to start selling tickets.
                </p>

                <button
                    class="btn btn-primary create-btn"
                    onclick="showCreateEvent()">

                    <i class="bi bi-plus-lg me-2"></i>
                    Create Event

                </button>

            </div>

        `;

        return;

    }


    /* Clear existing */

    eventList.innerHTML = "";


    /* Create cards */

    events.forEach(
        function(event) {


            /* Get bookings for this event */

            const eventBookings =
                bookings.filter(
                    function(booking) {

                        return (
                            Number(
                                booking.eventId
                            ) === Number(
                                event.id
                            )
                        );

                    }
                );


            /* Candidates */

            const candidates =
                eventBookings.length;


            /* Tickets sold */

            let ticketsSold = 0;

            let revenue = 0;


            eventBookings.forEach(
                function(booking) {

                    ticketsSold +=
                        Number(
                            booking.totalTickets || 0
                        );

                    revenue +=
                        Number(
                            booking.totalPrice || 0
                        );

                }
            );


            /* Total capacity */

            const totalCapacity =
                Number(
                    event.standardAvailable || 0
                ) +
                Number(
                    event.vipAvailable || 0
                );


            /* Card */

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "event-card";


            card.innerHTML = `

                <div class="row align-items-center">

                    <div class="col-lg-6">

                        <div class="event-title">

                            ${event.name}

                        </div>

                        <span class="event-category">

                            ${event.category}

                        </span>

                        <div class="event-info">

                            <div class="mb-2">

                                <i class="bi bi-calendar3 me-2"></i>

                                ${formatDate(event.date)}

                            </div>

                            <div class="mb-2">

                                <i class="bi bi-clock me-2"></i>

                                ${event.time}

                            </div>

                            <div>

                                <i class="bi bi-geo-alt me-2"></i>

                                ${event.venue}

                            </div>

                        </div>

                    </div>


                    <div class="col-lg-6 mt-4 mt-lg-0">

                        <div class="row">


                            <div class="col-4">

                                <div class="event-stat">

                                    <div class="event-stat-number">

                                        ${candidates}

                                    </div>

                                    <div class="event-stat-label">

                                        Candidates

                                    </div>

                                </div>

                            </div>


                            <div class="col-4">

                                <div class="event-stat">

                                    <div class="event-stat-number">

                                        ${ticketsSold}

                                    </div>

                                    <div class="event-stat-label">

                                        Tickets Sold

                                    </div>

                                </div>

                            </div>


                            <div class="col-4">

                                <div class="event-stat">

                                    <div class="event-stat-number">

                                        ₹${revenue.toLocaleString("en-IN")}

                                    </div>

                                    <div class="event-stat-label">

                                        Revenue

                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>


                <hr>


                <div class="d-flex justify-content-between align-items-center flex-wrap">

                    <div class="text-secondary small">

                        Capacity:

                        ${totalCapacity}

                        tickets

                    </div>


                    <div class="d-flex gap-2 mt-2 mt-md-0">

                        <button
                            class="btn btn-outline-primary btn-sm"
                            onclick="viewEvent(${event.id})">

                            <i class="bi bi-eye me-1"></i>

                            View

                        </button>


                        <button
                            class="btn btn-outline-danger btn-sm"
                            onclick="deleteEvent(${event.id})">

                            <i class="bi bi-trash me-1"></i>

                            Delete

                        </button>

                    </div>

                </div>

            `;


            eventList.appendChild(
                card
            );

        }
    );

}



/* =========================
   FORMAT DATE
========================= */

function formatDate(dateString) {

    const date =
        new Date(dateString);

    return date.toLocaleDateString(
        "en-IN",
        {
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );

}



/* =========================
   VIEW EVENT
========================= */

function viewEvent(eventId) {


    const events =
        JSON.parse(
            localStorage.getItem(
                "organizerEvents"
            )
        ) || [];


    const event =
        events.find(
            function(item) {

                return Number(
                    item.id
                ) === Number(
                    eventId
                );

            }
        );


    if (!event) {

        alert(
            "Event not found."
        );

        return;

    }


    const bookings =
        JSON.parse(
            localStorage.getItem(
                "bookings"
            )
        ) || [];


    const eventBookings =
        bookings.filter(
            function(booking) {

                return Number(
                    booking.eventId
                ) === Number(
                    eventId
                );

            }
        );


    let tickets = 0;

    let revenue = 0;


    eventBookings.forEach(
        function(booking) {

            tickets +=
                Number(
                    booking.totalTickets || 0
                );

            revenue +=
                Number(
                    booking.totalPrice || 0
                );

        }
    );


    alert(

        "Event Details\n\n" +

        "Event: " +
        event.name +

        "\nCategory: " +
        event.category +

        "\nDate: " +
        formatDate(event.date) +

        "\nTime: " +
        event.time +

        "\nVenue: " +
        event.venue +

        "\n\nCandidates Booked: " +
        eventBookings.length +

        "\nTickets Sold: " +
        tickets +

        "\nRevenue: ₹" +
        revenue.toLocaleString(
            "en-IN"
        )

    );

}



/* =========================
   DELETE EVENT
========================= */

function deleteEvent(eventId) {


    const confirmDelete =
        confirm(
            "Are you sure you want to delete this event?"
        );


    if (!confirmDelete) {

        return;

    }


    let events =
        JSON.parse(
            localStorage.getItem(
                "organizerEvents"
            )
        ) || [];


    events =
        events.filter(
            function(event) {

                return Number(
                    event.id
                ) !== Number(
                    eventId
                );

            }
        );


    localStorage.setItem(
        "organizerEvents",
        JSON.stringify(events)
    );


    loadDashboard();


    alert(
        "Event deleted successfully."
    );

}



/* =========================
   LOGOUT
========================= */

function logout() {

    localStorage.removeItem(
        "isLoggedIn"
    );

    localStorage.removeItem(
        "userRole"
    );

    window.location.href =
        "../registration-login/index.html";

}



/* =========================
   INITIAL LOAD
========================= */

loadDashboard();


</script>
