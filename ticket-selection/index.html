<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>EventHub - Ticket Selection</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">


    <style>

        body {

            margin: 0;

            background: #f5f7fa;

            font-family: Arial, sans-serif;

        }


        .ticket-card {

            border-radius: 15px;

            transition:
                transform 0.2s;

        }


        .ticket-card:hover {

            transform:
                translateY(-2px);

        }


        .quantity-control {

            display: flex;

            justify-content: flex-end;

            align-items: center;

            gap: 15px;

        }


        .quantity-btn {

            width: 42px;

            height: 42px;

            border-radius: 8px;

            border:
                1px solid #0d6efd;

            background: white;

            color: #0d6efd;

            font-size: 18px;

            display: flex;

            justify-content: center;

            align-items: center;

        }


        .quantity-btn:hover {

            background: #0d6efd;

            color: white;

        }


        .quantity {

            min-width: 30px;

            text-align: center;

            font-size: 18px;

            font-weight: bold;

        }


        .summary-card {

            border-radius: 15px;

            position: sticky;

            top: 20px;

        }


        .summary-row {

            display: flex;

            justify-content: space-between;

            padding: 10px 0;

        }


        .total-row {

            font-size: 20px;

            margin-top: 10px;

        }


        @media (max-width: 768px) {

            .quantity-control {

                justify-content: flex-start;

                margin-top: 15px;

            }

        }

    </style>

</head>


<body>


<!-- Navbar -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <span class="navbar-brand fw-bold">

            <i class="bi bi-ticket-perforated me-2"></i>

            EventHub

        </span>


        <button
            onclick="logout()"
            class="btn btn-outline-light btn-sm">

            Logout

        </button>

    </div>

</nav>


<div class="container py-5">


    <!-- Event -->

    <div class="mb-4">

        <p class="text-primary fw-bold">

            SELECT TICKETS

        </p>


        <h1 class="fw-bold">

            KCT Tech Fest 2026

        </h1>


        <p class="text-secondary">

            <i class="bi bi-calendar3 me-2"></i>

            18 October 2026

            <span class="mx-2">•</span>

            <i class="bi bi-geo-alt me-1"></i>

            Kumaraguru College of Technology

        </p>

    </div>


    <div class="row g-4">


        <!-- Tickets -->

        <div class="col-lg-8">


            <!-- Standard -->

            <div class="card ticket-card border-0 shadow-sm mb-3">

                <div class="card-body p-4">

                    <div class="row align-items-center">


                        <div class="col-md-5">

                            <span class="badge bg-primary mb-2">

                                STANDARD

                            </span>


                            <h4 class="fw-bold">

                                Standard Ticket

                            </h4>


                            <p class="text-secondary">

                                80 tickets available

                            </p>

                        </div>


                        <div class="col-md-3">

                            <h4 class="text-primary fw-bold">

                                ₹199

                            </h4>


                            <small class="text-secondary">

                                per ticket

                            </small>

                        </div>


                        <div class="col-md-4">

                            <div class="quantity-control">


                                <button
                                    id="standardMinus"
                                    class="quantity-btn">

                                    <i class="bi bi-dash"></i>

                                </button>


                                <span
                                    id="standardQuantity"
                                    class="quantity">

                                    0

                                </span>


                                <button
                                    id="standardPlus"
                                    class="quantity-btn">

                                    <i class="bi bi-plus"></i>

                                </button>

                            </div>

                        </div>

                    </div>

                </div>

            </div>


            <!-- VIP -->

            <div class="card ticket-card border-0 shadow-sm mb-3">

                <div class="card-body p-4">

                    <div class="row align-items-center">


                        <div class="col-md-5">

                            <span
                                class="badge bg-warning text-dark mb-2">

                                VIP

                            </span>


                            <h4 class="fw-bold">

                                VIP Ticket

                            </h4>


                            <p class="text-secondary">

                                25 tickets available

                            </p>

                        </div>


                        <div class="col-md-3">

                            <h4 class="text-primary fw-bold">

                                ₹499

                            </h4>


                            <small class="text-secondary">

                                per ticket

                            </small>

                        </div>


                        <div class="col-md-4">

                            <div class="quantity-control">


                                <button
                                    id="vipMinus"
                                    class="quantity-btn">

                                    <i class="bi bi-dash"></i>

                                </button>


                                <span
                                    id="vipQuantity"
                                    class="quantity">

                                    0

                                </span>


                                <button
                                    id="vipPlus"
                                    class="quantity-btn">

                                    <i class="bi bi-plus"></i>

                                </button>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>


        <!-- Summary -->

        <div class="col-lg-4">

            <div class="card summary-card border-0 shadow-sm">

                <div class="card-body p-4">


                    <h4 class="fw-bold mb-4">

                        Booking Summary

                    </h4>


                    <div id="summaryItems">

                        <p class="text-secondary">

                            No tickets selected.

                        </p>

                    </div>


                    <hr>


                    <div class="summary-row">

                        <span>
                            Total Tickets
                        </span>

                        <strong id="totalTickets">
                            0
                        </strong>

                    </div>


                    <div class="summary-row total-row">

                        <strong>
                            Total Amount
                        </strong>

                        <strong
                            id="totalPrice"
                            class="text-primary">

                            ₹0

                        </strong>

                    </div>


                    <button
                        id="continueButton"
                        class="btn btn-primary w-100 mt-4">

                        Continue

                        <i class="bi bi-arrow-right ms-2"></i>

                    </button>

                </div>

            </div>

        </div>

    </div>

</div>


<script>


/* =========================
   LOGIN CHECK
========================= */

if (
    localStorage.getItem("isLoggedIn")
    !== "true"
) {

    window.location.href =
        "../registration-login/index.html";

}


/* =========================
   VARIABLES
========================= */

let standardQuantity = 0;

let vipQuantity = 0;


const standardPrice = 199;

const vipPrice = 499;


const standardAvailable = 80;

const vipAvailable = 25;


/* =========================
   ELEMENTS
========================= */

const standardQuantityElement =
    document.getElementById(
        "standardQuantity"
    );


const vipQuantityElement =
    document.getElementById(
        "vipQuantity"
    );


const totalTicketsElement =
    document.getElementById(
        "totalTickets"
    );


const totalPriceElement =
    document.getElementById(
        "totalPrice"
    );


const summaryItems =
    document.getElementById(
        "summaryItems"
    );


/* =========================
   UPDATE
========================= */

function updateSummary() {


    standardQuantityElement.textContent =
        standardQuantity;


    vipQuantityElement.textContent =
        vipQuantity;


    const totalTickets =
        standardQuantity +
        vipQuantity;


    totalTicketsElement.textContent =
        totalTickets;


    const totalPrice =
        (standardQuantity * standardPrice) +
        (vipQuantity * vipPrice);


    totalPriceElement.textContent =
        "₹" + totalPrice;


    summaryItems.innerHTML = "";


    if (totalTickets === 0) {

        summaryItems.innerHTML = `

            <p class="text-secondary">

                No tickets selected.

            </p>

        `;

        return;

    }


    if (standardQuantity > 0) {

        summaryItems.innerHTML += `

            <div class="summary-row">

                <span>
                    Standard × ${standardQuantity}
                </span>

                <strong>
                    ₹${standardQuantity * standardPrice}
                </strong>

            </div>

        `;

    }


    if (vipQuantity > 0) {

        summaryItems.innerHTML += `

            <div class="summary-row">

                <span>
                    VIP × ${vipQuantity}
                </span>

                <strong>
                    ₹${vipQuantity * vipPrice}
                </strong>

            </div>

        `;

    }

}


/* =========================
   STANDARD PLUS
========================= */

document.getElementById(
    "standardPlus"
).addEventListener(
    "click",
    function() {

        if (
            standardQuantity <
            standardAvailable
        ) {

            standardQuantity++;

            updateSummary();

        }

    }
);


/* =========================
   STANDARD MINUS
========================= */

document.getElementById(
    "standardMinus"
).addEventListener(
    "click",
    function() {

        if (standardQuantity > 0) {

            standardQuantity--;

            updateSummary();

        }

    }
);


/* =========================
   VIP PLUS
========================= */

document.getElementById(
    "vipPlus"
).addEventListener(
    "click",
    function() {

        if (
            vipQuantity <
            vipAvailable
        ) {

            vipQuantity++;

            updateSummary();

        }

    }
);


/* =========================
   VIP MINUS
========================= */

document.getElementById(
    "vipMinus"
).addEventListener(
    "click",
    function() {

        if (vipQuantity > 0) {

            vipQuantity--;

            updateSummary();

        }

    }
);


/* =========================
   CONTINUE
========================= */

document.getElementById(
    "continueButton"
).addEventListener(
    "click",
    function() {

        const totalTickets =
            standardQuantity +
            vipQuantity;


        if (totalTickets === 0) {

            alert(
                "Please select at least one ticket."
            );

            return;

        }


        const totalPrice =
            (standardQuantity * standardPrice) +
            (vipQuantity * vipPrice);


       const bookingData = {

    standardQuantity: standardQuantity,

    vipQuantity: vipQuantity,

    totalTickets: totalTickets,

    totalPrice: totalPrice

};


localStorage.setItem(
    "bookingData",
    JSON.stringify(bookingData)
);


window.location.href =
    "../payment/index.html";

    }
);


/* =========================
   LOGOUT
========================= */

function logout() {

    localStorage.removeItem(
        "isLoggedIn"
    );

    window.location.href =
        "../registration-login/index.html";

}


/* =========================
   START
========================= */

updateSummary();

</script>

</body>

</html>
